<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>统一身份认证登录</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            width: 360px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
            padding: 40px 36px;
        }

        .login-title {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            font-size: 13px;
            color: #909399;
            margin-bottom: 28px;
        }

        .form-item {
            margin-bottom: 18px;
        }

        .form-item label {
            display: block;
            font-size: 13px;
            color: #606266;
            margin-bottom: 6px;
        }

        .form-item input {
            width: 100%;
            box-sizing: border-box;
            height: 38px;
            padding: 0 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-item input:focus {
            border-color: #409eff;
        }

        .btn-login {
            width: 100%;
            height: 40px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #66b1ff;
        }

        .alert-error {
            background: #fef0f0;
            color: #f56c6c;
            border: 1px solid #fde2e2;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-title">统一身份认证</div>
        <div class="login-subtitle">请登录后继续授权</div>
        <div th:if="${param.error}" class="alert-error">用户名或密码错误</div>
        <form th:action="@{/iam/oauth2/authServer/login}" method="post">
            <div class="form-item">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="form-item">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>
    </div>
</body>

</html>
