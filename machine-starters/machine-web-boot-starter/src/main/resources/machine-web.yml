spring:
  ai:
    chat:
      client:
        enabled: false
    ollama:
      base-url: ${machine.ai.ollama.base-url}
      chat:
        options:
          model: ${machine.ai.ollama.chat.options.model:deepseek-r1:8b}
    deepseek:
      api-key: ${machine.ai.deepseek.api-key}
      chat:
        options:
          model: ${machine.ai.deepseek.chat.options.model:deepseek-v4-flash}
    dashscope:
      base_url: ${machine.ai.dashscope.base-url}
      api-key: ${machine.ai.dashscope.api-key}
      chat:
        options:
          model: ${machine.ai.dashscope.chat.options.model:qwen3.7-max}